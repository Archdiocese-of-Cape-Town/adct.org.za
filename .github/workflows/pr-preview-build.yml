name: Build plugin package

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: plugin-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Playground artifact
    if: ${{ github.event_name == 'pull_request' }}
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-build.yml@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4.0.0
    with:
      artifacts: parish-intake=dist/adct-parish-intake.zip
      php-version: '8.2'
      build-command: |
        set -euo pipefail
        sh scripts/build-release.sh
        sh scripts/validate-release-zip.sh
      blueprint-from-build: .github/playground/blueprint.json

  tag-build:
    name: Build release zip
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Build and validate release zip
        run: sh scripts/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: adct-parish-intake.zip
          path: dist/adct-parish-intake.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach zip to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tag-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adct-parish-intake.zip
          path: dist

      - name: Create release and attach plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" dist/adct-parish-intake.zip --verify-tag --generate-notes --title "$TAG_NAME"
