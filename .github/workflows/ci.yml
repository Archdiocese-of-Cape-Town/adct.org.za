name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.2 is production (xneelo); 8.3 and 8.4 guard against host upgrades.
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # Not --strict: no license is chosen yet, which composer reports as a warning. A stale lock file still fails.
      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - uses: ramsey/composer-install@v3

      - name: Lint PHP files
        run: find src tests adct-parish-intake.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run tests
        run: composer test

      - name: Write parser fixture score
        if: matrix.php == '8.2'
        run: |
          printf '### Parser fixture score\n\n' >> "$GITHUB_STEP_SUMMARY"
          composer fixture-score >> "$GITHUB_STEP_SUMMARY"

  wordpress-integration:
    name: WordPress integration (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install wp-env
        run: npm ci

      - name: Build the installable plugin zip
        run: sh scripts/build-release.sh

      - name: Run WordPress integration tests
        run: composer test:integration

  imap-greenmail:
    name: IMAP integration (GreenMail, PHP 8.2)
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.13
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=intake:greenmail-test-password@example.test,connection-test:greenmail-test-password@example.test -Dgreenmail.users.login=EMAIL"
        ports:
          - 3025:3025
          - 3143:3143
    env:
      IMAP_TEST_HOST: 127.0.0.1
      IMAP_TEST_PORT: 3143
      IMAP_TEST_SMTP_PORT: 3025
      IMAP_TEST_USERNAME: intake@example.test
      IMAP_TEST_PASSWORD: greenmail-test-password
      IMAP_CONNECTION_TEST_USERNAME: connection-test@example.test
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run GreenMail IMAP and connection-test integration tests
        run: vendor/bin/phpunit --group greenmail tests/Integration/Imap
